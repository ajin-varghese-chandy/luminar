<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task1.css">
</head>
<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-4 text-center">

            <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" class="logo">

            <h2 class="heading">Sign in to GitHub</h2>

            <div class="card login-box">

                <form>

                    <div class="mb-3 text-start">
                        <label class="form-label">Username or email address</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="mb-3">

                        <div class="d-flex justify-content-between">
                            <label class="form-label">Password</label>
                            <a href="#" class="small text-decoration-none">Forgot password?</a>
                        </div>

                        <input type="password" class="form-control">

                    </div>

                    <button class="btn btn-success w-100">
                        Sign in
                    </button>

                </form>

            </div>

            <div class="card signup-box">

                <p class="mb-0">
                    New to GitHub?
                    <a href="#" class="text-decoration-none">Create an account.</a>
                </p>

            </div>

            <div class="footer-links">

                <a href="#">Terms</a>
                <a href="#">Privacy</a>
                <a href="#">Security</a>
                <a href="#">Contact</a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
