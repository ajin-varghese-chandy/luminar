<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task2.css">
</head>
<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow form-card">

                <div class="card-header text-center bg-dark text-white">
                    <h3>- EVENT REGISTRATION -</h3>
                </div>

                <div class="card-body p-5">

                    <form>

                        <div class="row mb-4">

                            <label class="col-md-3 col-form-label">Name</label>

                            <div class="col-md-4">
                                <input type="text" placeholder="First name" class="form-control">
                               
                            </div>

                            <div class="col-md-5">
                                <input type="text" placeholder="Last name" class="form-control">
                                
                            </div>

                        </div>

                        <div class="row mb-4">

                            <label class="col-md-3 col-form-label">Company</label>

                            <div class="col-md-9">
                                <input type="text" placeholder="Company name" class="form-control">
                            </div>

                        </div>

                        <div class="row mb-4">

                            <label class="col-md-3 col-form-label">Email</label>

                            <div class="col-md-9">
                                <input type="email" class="form-control" placeholder="example@email.com">
                            </div>

                        </div>

                        <div class="row mb-4">

                            <label class="col-md-3 col-form-label">Phone</label>

                            <div class="col-md-3">
                                <input type="text" placeholder="Area code" class="form-control">
                                
                            </div>

                            <div class="col-md-6">
                                <input type="text" placeholder="phone Number" class="form-control">
                                
                            </div>

                        </div>

                        <div class="row mb-5">

                            <label class="col-md-3 col-form-label">Subject</label>

                            <div class="col-md-9">
                                <select class="form-select">
                                    <option>Choose Option</option>
                                    <option>Web Development</option>
                                    <option>Python</option>
                                    <option>Java</option>
                                </select>
                            </div>

                        </div>

                        <div class="row mb-4">

                            <div class="col-md-3">
                                <label>Are you an existing customer?</label>
                            </div>

                            <div class="col-md-9">

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="customer" checked>
                                    <label class="form-check-label">Yes</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="customer">
                                    <label class="form-check-label">No</label>
                                </div>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-3"></div>

                            <div class="col-md-9">
                                <button class="btn btn-danger px-5">REGISTER</button>
                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
