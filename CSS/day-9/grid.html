<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <h1 class="text-center text-primary">Grid</h1>
    <div class="row">
        <div class="col-12 bg-info">A</div>
    </div>

    <br>
    <div class="row">
        <div class="col-1 bg-info">1</div>
        <div class="col-1">2</div>
        <div class="col-1 bg-info">3</div>
        <div class="col-1">4</div>
        <div class="col-1 bg-info">5</div>
        <div class="col-1">6</div>
        <div class="col-1 bg-info">7</div>
        <div class="col-1">8</div>
        <div class="col-1 bg-info">9</div>
        <div class="col-1">10</div>
        <div class="col-1 bg-info">11</div>
        <div class="col-1">12</div>
    </div>
    <br>
    <div class="row">
        <div class="col-6 bg-info">A</div>
        <div class="col-6 bg-danger">B</div>
    </div>
    <br>
    <div class="row">
        <div class="col-3 bg-info">A</div>
        <div class="col-3 bg-danger">B</div>
        <div class="col-3 bg-primary">A</div>
        <div class="col-3 bg-secondary">A</div>
    </div>
</body>

</html>
