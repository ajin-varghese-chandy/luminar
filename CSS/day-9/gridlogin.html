<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="row border border-4 border-dark m-2 p-4">
        <div class="col-6">
            <img width="500px" src="images/login.png" alt="">
        </div>
        <div style="margin-top: 150px;" class="col-6 ">
            <h1 class="text-center">
                Login
            </h1>
            <input type="text" class="form-control" placeholder="enter your name.">
            <br>
            <input type="password" class="form-control" placeholder="enter your password">
            <br>
            <div class="d-grid">
                <button class="btn btn-success">Login</button>
            </div>
        </div>
    </div>
    <div style="margin-top: 100px;margin-bottom: 100px;" class="row m-4 p-4">
        <div class="col-4"></div>
        <div class="col-4">
            <h1 class="text-center">
                Login
            </h1>
            <input type="text" class="form-control" placeholder="enter your name.">
            <br>
            <input type="password" class="form-control" placeholder="enter your password">
            <br>
            <div class="d-grid">
                <button class="btn btn-success">Login</button>
            </div>
        </div>
        <div class="col-4"></div>
    </div>
</body>

</html>
