<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-align: center;
            font-size: 50px;
            color: blue;
        }
        button {
            display: block;
            margin: auto;
            padding: 30px;
            font-size: 40px;
            background-color: blue;
            color: wheat;
        }
    </style>
</head>
<body>
    <h1>
        Random Number Generation
    </h1>
    <button onclick="rnd()" >Random Number</button>

    <script>
function rnd(){
    const rndNu = Math.floor(Math.random()*50)
    document.querySelector('button').innerText = "Random Number " + rndNu;
}
    </script>
</body>
</html>
