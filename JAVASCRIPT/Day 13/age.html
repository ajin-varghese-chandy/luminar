<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background-color: aliceblue;
        }

        .box {
            margin-top: 150px;
            background-color: rgb(184, 184, 26);
            width: 400px;
            height: 400px;
            border: 5px solid black;

        }

        h1 {
            text-align: center;
            margin-top: 70px;
            font-size: 40px;
        }

        input {
            width: 90%;
            margin-left: 15px;
            margin-bottom: 20px;
            height: 40px;
            background-color: aliceblue;
            border: 0cap;
            font-size: 30px;
        }

        button {
            background-color: rgb(184, 184, 26);
            text-align: center;
            color: blue;
            width: 90%;
            height: 50px;
            font-size: 20px;
            border: 2px solid blue;
            margin: 20px;

        }

        #alert {
            margin: 15px;

        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Age Checker</h1>
        <input id="age" type="text"><br>
        <button onclick="ageChecker()">Check</button>
        <h4 id="alert"></h4>
    </div>

    <script>
        function ageChecker() {
            const input = document.getElementById('age').value;
            const alert = document.getElementById('alert');
            if (input >= 18) {
                alert.style.color = 'green'
                alert.innerText = 'Eligible'

            } else {
                alert.style.color = 'red'
                alert.innerText = 'not Eligible'
            }

        }
    </script>
</body>

</html>
