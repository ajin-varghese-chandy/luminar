<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="calculator" class="calculator">
        <h1 id="title" class="title">Calculator</h1>


        <div id="display-container" class="display-container">
            <input type="text" id="display" class="display" value="0" placeholder="0" readonly>
        </div>

        <div id="buttons" class="buttons">
            <button id="seven" class="btn number" onclick="displayNumber(7)">7</button>
            <button id="eight" class="btn number" onclick="displayNumber(8)">8</button>
            <button id="nine" class="btn number" onclick="displayNumber(9)">9</button>
            <button id="multiply" class="btn operator" onclick="displayNumber('*')">×</button>

            <button id="four" class="btn number" onclick="displayNumber(4)">4</button>
            <button id="five" class="btn number" onclick="displayNumber(5)">5</button>
            <button id="six" class="btn number" onclick="displayNumber(6)">6</button>
            <button id="subtract" class="btn operator" onclick="displayNumber('-')">−</button>

            <button id="one" class="btn number" onclick="displayNumber(1)">1</button>
            <button id="two" class="btn number" onclick="displayNumber(2)">2</button>
            <button id="three" class="btn number" onclick="displayNumber(3)">3</button>
            <button id="add" class="btn operator" onclick="displayNumber('+')">+</button>

            <button id="doubleZero" class="btn number" onclick="displayNumber('00')">00</button>
            <button id="zero" class="btn number" onclick="displayNumber(0)">0</button>
            <button id="decimal" class="btn number" onclick="displayNumber('.')">.</button> 
            <button id="divide" class="btn operator" onclick="displayNumber('/')">÷</button>
            <button id="clear" onclick="clearDisplay()" class="btn action">AC</button>
            <button id="backspace" onclick="removelastitem()" class="btn action">
                << </button>
                    <button onclick="evaluateexp()" id="equals" class="btn equals">=</button>

        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
