<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
        }

        header {
            width: 100%;
            height: 60px;

            display: flex;
        }

        header h1 {
            padding: 10px;
        }

        main {
            width: 100%;
            height: 91vh;
            display: flex;
            justify-content: center;
            background-color: rgb(187, 246, 248);
        }

        .login-box {
            width: 400px;
            height: 250px;
            margin-top: 200px;
            background-color: white;
            display: grid;
            align-items: center;
            place-items: center;
            padding: 20px;
            border-radius: 20px;
        }

        .login-box input {
            padding: 10px;
            width: 80%;
        }

        .login-box button {
            background-color: aqua;
            padding: 10px;
            width: 50%;
            font-weight: bolder;
        }
    </style>
</head>

<body>
    <header>
        <img width="60px" height="60px" src="../logo.png" alt="">
        <h1>Employee Management System</h1>
    </header>

    <main>
        <div class="login-box">
            <h1>Login</h1> <br>
            <input id="usrname" type="text" placeholder="Username">
            <input type="password" name="" placeholder="password" id="">
            <button onclick="login()" >Login</button>
        </div>
    </main>
    <script src="login.js"></script>
</body>

</html>
