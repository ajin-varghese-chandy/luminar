<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-700 flex items-center justify-center px-4 py-8">

    <main class="w-full max-w-md">
        <section class="bg-white rounded-2xl shadow-xl border border-slate-200 px-7 py-8 sm:px-9">

            <div class="flex justify-center">
                <div class="w-20 h-20 rounded-2xl bg-blue-50 border border-slate-200 flex items-center justify-center">
                    <img
                        src="https://pngimg.com/uploads/bank/bank_PNG5.png"
                        alt=""
                        class="w-12 h-12 object-contain"
                    />
                </div>
            </div>

            <div class="text-center mt-5 name">
                <h1 class="text-2xl font-bold tracking-tight text-blue-700">
                    My Bank
                </h1>
            </div>

            <form class="p-1 mt-7 space-y-4">
                <div class="form-field flex items-center">
                    <input
                        type="text"
                        name="acno"
                        id="login_acno"
                        placeholder="Account number"
                        class="w-full h-12 rounded-xl border border-slate-300 bg-slate-50 px-4 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-700 focus:bg-white focus:ring-2 focus:ring-blue-700/10"
                    />
                </div>

                <div class="form-field flex items-center">
                    <input
                        type="password"
                        name="password"
                        id="login_pswd"
                        placeholder="Password"
                        class="w-full h-12 rounded-xl border border-slate-300 bg-slate-50 px-4 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-700 focus:bg-white focus:ring-2 focus:ring-blue-700/10"
                    />
                </div>

                <button
                    onclick="login()"
                    class="btn mt-3 w-full h-12 rounded-xl bg-blue-700 px-5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-800 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-blue-700 focus:ring-offset-2"
                    type="button"
                >
                    Login
                </button>
            </form>

            <div class="text-center text-sm mt-6 text-slate-500">
                <a
                    href="#"
                    class="font-medium text-blue-700 transition hover:text-blue-800 hover:underline"
                >Forget password?</a>
                <span class="mx-1">or</span>
                <a
                    href="signup.html"
                    class="font-semibold text-blue-700 transition hover:text-blue-800 hover:underline"
                >Sign up</a>
            </div>

        </section>
    </main>
<script src="bank.js"></script>
</body>
</html>
