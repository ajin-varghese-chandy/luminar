<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NASA — 2D Deep Space Parallax</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      color: #fff;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #0B3D91; border-radius: 3px; }

    .cursor {
      position: fixed; width: 10px; height: 10px;
      background: #FC3D21; border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px #FC3D21, 0 0 30px rgba(252,61,33,0.4);
    }
    .cursor-ring {
      position: fixed; width: 44px; height: 44px;
      border: 1.5px solid rgba(252,61,33,0.5); border-radius: 50%;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, border-color 0.2s;
    }
    .scroll-progress {
      position: fixed; top: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, #0B3D91, #FC3D21, #fff);
      z-index: 10000; width: 0%;
      will-change: width;
      box-shadow: 0 0 15px rgba(11,61,145,0.5);
    }

    .nasa-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      z-index: 9995; display: flex; align-items: center;
      padding: 0 32px;
      background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
      pointer-events: none;
    }
    .nasa-logo { display: flex; align-items: center; gap: 14px; }
    .nasa-logo svg { height: 28px; filter: drop-shadow(0 0 8px rgba(252,61,33,0.3)); }
    .nasa-logo-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.15); margin: 0 16px; }
    .nasa-tagline { font-size: 11px; font-weight: 300; letter-spacing: 0.15em; color: rgba(255,255,255,0.35); text-transform: uppercase; }

    .scene-wrap {
      position: fixed; inset: 0;
      overflow: hidden;
      contain: layout style;
    }
    .layer {
      position: absolute; inset: -200px;
      will-change: transform;
      contain: layout style;
    }
    .layer-bg { z-index: 0; }
    .layer-nebula { z-index: 1; }
    .layer-stars { z-index: 2; }
    .layer-asteroids { z-index: 3; }
    .layer-planets { z-index: 4; }
    .layer-ring { z-index: 5; }
    .layer-text { z-index: 6; }
    .layer-fore { z-index: 7; }
    .layer-ui { inset: 0; z-index: 8; pointer-events: none; contain: layout style; }

    .section {
      position: relative; width: 100vw; z-index: 1;
      pointer-events: none;
    }
    .section.s1 { height: 100vh; }
    .section.s2 { height: 100vh; }
    .section.s3 { height: 100vh; }
    .section.s4 { height: 110vh; }
    .section.s5 { height: 100vh; }
    .section.s6 { height: 110vh; }
    .section.s7 { height: 100vh; }
    .section.s-footer { height: 50vh; }

    .planet-img {
      position: absolute;
      border-radius: 50%;
      overflow: hidden;
      will-change: transform;
      contain: layout style;
    }
    .planet-img canvas { width: 100%; height: 100%; display: block; }

    .saturn-ring {
      position: absolute; border-radius: 50%;
      border: 3px solid rgba(210,180,140,0.4);
      box-shadow: 0 0 30px rgba(210,180,140,0.12);
      pointer-events: none;
      animation: satSpin 25s linear infinite;
    }
    @keyframes satSpin { to { transform: rotate(360deg); } }

    .ring-2d {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(11,61,145,0.15);
      box-shadow: 0 0 30px rgba(11,61,145,0.06);
      animation: ringPulse 5s ease-in-out infinite alternate;
    }
    @keyframes ringPulse {
      0% { opacity: 0.25; transform: scale(1); }
      100% { opacity: 0.7; transform: scale(1.06); }
    }

    .star {
      position:absolute; border-radius:50%; background:#fff;
      animation: twinkle var(--dur) ease-in-out infinite alternate;
      contain: strict;
    }
    @keyframes twinkle {
      0% { opacity:0.15; transform:scale(0.8); }
      100% { opacity:1; transform:scale(1.2); }
    }
    .asteroid {
      position:absolute; border-radius:50%;
      background:radial-gradient(circle at 40% 35%, #8a7a6a, #4a3a2a);
      contain: strict;
    }
    .particle {
      position:absolute; border-radius:50%;
      background:rgba(255,255,255,0.7);
      pointer-events:none;
      contain: strict;
    }

    .glitch-line {
      position: fixed; height: 1px; width: 100%;
      background: linear-gradient(90deg, transparent, #FC3D21, transparent);
      opacity: 0; z-index: 10; pointer-events: none;
    }
    .shooting-star {
      position: fixed; width: 100px; height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8));
      border-radius: 1px; pointer-events: none; z-index: 50;
      opacity: 0;
    }
    .trail-dot {
      position: fixed; border-radius: 50%;
      background: rgba(252,61,33,0.35);
      pointer-events: none; z-index: 9997;
      transition: opacity 0.5s, transform 0.5s;
      contain: strict;
    }
    .scanlines {
      position: fixed; inset: 0; z-index: 9996; pointer-events: none; opacity: 0.3;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
      pointer-events: none;
    }
    .section-text {
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; pointer-events:none;
      opacity:0; transition:opacity 1.2s ease;
      will-change: opacity;
    }

    @keyframes orbPulse {
      0% { transform: scale(1); opacity:0.25; }
      100% { transform: scale(1.2); opacity:0.4; }
    }
    @keyframes nebulaDrift {
      0% { transform: translate(0,0); opacity:0.08; }
      100% { transform: translate(60px,-30px); opacity:0.18; }
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    @media (max-width: 768px) {
      .cursor, .cursor-ring { display: none; }
      body { cursor: auto; }
      .nasa-bar { display: none; }
    }
  </style>
</head>
<body>

  <div class="scroll-progress" id="scrollProgress"></div>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="nasa-bar">
    <div class="nasa-logo">
      <svg viewBox="0 0 140 40" fill="none">
        <circle cx="20" cy="20" r="18" fill="#0B3D91" stroke="#FC3D21" stroke-width="1.5"/>
        <path d="M10 20 Q15 12 20 20 Q25 28 30 20" stroke="#FC3D21" stroke-width="1.5" fill="none"/>
        <text x="42" y="24" fill="white" font-size="11" font-weight="700" font-family="Inter" letter-spacing="3">NASA</text>
        <text x="100" y="24" fill="rgba(255,255,255,0.3)" font-size="8" font-family="Inter" letter-spacing="1.5">2D PARALLAX</text>
      </svg>
      <div class="nasa-logo-divider"></div>
      <span class="nasa-tagline">2D Deep Space Mission</span>
    </div>
  </div>

  <div class="scene-wrap" id="sceneWrap">

    <div class="layer layer-bg" id="layerBg" data-mouse="0.01" data-scroll="-0.02">
      <div style="position:absolute;inset:0;">
        <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920&q=80" alt="" style="width:100%;height:100%;object-fit:cover;opacity:0.4;">
      </div>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 55% 45%,rgba(255,200,150,0.04) 0%,transparent 40%),radial-gradient(ellipse at 45% 55%,rgba(200,180,255,0.03) 0%,transparent 35%);"></div>
      <div style="width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,#0B3D91,transparent);filter:blur(100px);opacity:0.25;position:absolute;top:-15%;left:-10%;animation:orbPulse 8s ease-in-out infinite alternate;"></div>
      <div style="width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,#FC3D21,transparent);filter:blur(100px);opacity:0.15;position:absolute;bottom:-15%;right:-10%;animation:orbPulse 8s ease-in-out infinite alternate;animation-delay:-4s;"></div>
    </div>

    <div class="layer layer-nebula" id="layerNebula" data-mouse="0.02" data-scroll="-0.04">
      <div style="position:absolute;width:600px;height:450px;border-radius:50%;filter:blur(120px);background:radial-gradient(circle,rgba(11,61,145,0.25),transparent);top:0;right:0;opacity:0.12;animation:nebulaDrift 25s ease-in-out infinite alternate;"></div>
      <div style="position:absolute;width:500px;height:400px;border-radius:50%;filter:blur(120px);background:radial-gradient(circle,rgba(252,61,33,0.12),transparent);bottom:0;left:0;opacity:0.1;animation:nebulaDrift 25s ease-in-out infinite alternate;animation-delay:-8s;"></div>
    </div>

    <div class="layer layer-stars" id="starsLayer" data-mouse="0.03" data-scroll="-0.06"></div>
    <div class="layer layer-asteroids" id="asteroidLayer" data-mouse="0.05" data-scroll="-0.1"></div>
    <div class="layer layer-planets" id="planetsLayer" data-mouse="0.08" data-scroll="-0.13"></div>

    <div class="layer layer-ring" id="layerRings" data-mouse="0.12" data-scroll="-0.18">
      <div class="ring-2d" style="width:85vw;height:85vw;top:7.5vh;left:7.5vw;border-width:2px;border-color:rgba(11,61,145,0.12);"></div>
      <div class="ring-2d" style="width:65vw;height:65vw;top:17.5vh;left:17.5vw;animation-delay:-2.5s;border-color:rgba(252,61,33,0.08);"></div>
      <div class="ring-2d" style="width:45vw;height:45vw;top:27.5vh;left:27.5vw;animation-delay:-1.2s;border-color:rgba(255,255,255,0.06);"></div>
    </div>

    <div class="layer layer-fore" id="foreLayer" data-mouse="0.22" data-scroll="-0.38"></div>
    <div class="layer layer-ui" id="uiLayer"></div>

  </div>

  <div class="section s1" id="sec1"></div>
  <div class="section s2" id="sec2"></div>
  <div class="section s3" id="sec3"></div>
  <div class="section s4" id="sec4"></div>
  <div class="section s5" id="sec5"></div>
  <div class="section s6" id="sec6"></div>
  <div class="section s7" id="sec7"></div>
  <div class="section s-footer" id="secFooter"></div>

  <div style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:20;color:rgba(255,255,255,0.2);font-size:10px;letter-spacing:0.4em;text-transform:uppercase;transition:opacity 0.8s;text-align:center;pointer-events:none;" id="scrollHint">
    scroll <span style="display:block;margin-top:8px;font-size:16px;animation:bounce 2s ease-in-out infinite;">⌄</span>
  </div>
  <div style="position:fixed;bottom:30px;right:30px;z-index:100;color:rgba(255,255,255,0.12);font-size:10px;letter-spacing:0.2em;font-family:Inter,monospace;pointer-events:none;">◈ NASA 2D PARALLAX</div>
  <div class="scanlines"></div>

  <script>
    // === OPTIMIZED 2D PARALLAX ENGINE ===

    // --- Cursor ---
    const cursor = document.getElementById('cursor');
    const cursorRing = document.getElementById('cursorRing');
    let cx = -100, cy = -100;
    document.addEventListener('mousemove', (e) => {
      cx = e.clientX; cy = e.clientY;
      cursor.style.left = cx + 'px'; cursor.style.top = cy + 'px';
      cursorRing.style.left = cx + 'px'; cursorRing.style.top = cy + 'px';
    });
    document.addEventListener('mousedown', () => {
      cursorRing.style.width = '56px'; cursorRing.style.height = '56px';
      cursorRing.style.borderColor = 'rgba(252,61,33,0.8)';
    });
    document.addEventListener('mouseup', () => {
      cursorRing.style.width = '44px'; cursorRing.style.height = '44px';
      cursorRing.style.borderColor = 'rgba(252,61,33,0.5)';
    });

    // --- Canvas planet texture (generated once, cached) ---
    function createPlanetTexture(w, h, colors, bands) {
      const c = document.createElement('canvas');
      c.width = w * 2; c.height = h * 2;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(w*0.4, h*0.3, 0, w, h, w);
      colors.forEach((clr, i) => grad.addColorStop(i/(colors.length-1), clr));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(w, h, w, 0, Math.PI*2); ctx.fill();
      if (bands) bands.forEach((b) => { ctx.fillStyle = b.color; ctx.fillRect(0, b.y*h, w*2, b.h*h); });
      const shd = ctx.createRadialGradient(w*0.9, h, 0, w, h, w);
      shd.addColorStop(0, 'rgba(0,0,0,0)'); shd.addColorStop(1, 'rgba(0,0,0,0.5)');
      ctx.fillStyle = shd; ctx.beginPath(); ctx.arc(w, h, w, 0, Math.PI*2); ctx.fill();
      const hl = ctx.createRadialGradient(w*0.35, h*0.3, 0, w*0.35, h*0.3, w*0.5);
      hl.addColorStop(0, 'rgba(255,255,255,0.1)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hl; ctx.beginPath(); ctx.arc(w, h, w, 0, Math.PI*2); ctx.fill();
      return c;
    }

    // --- Build planets ---
    const planetsLayer = document.getElementById('planetsLayer');
    const bodies = [];
    const ringEls = [];
    const planetDefs = [
      { w:260, h:260, p:'50%', p2:'50%', sh:'0 0 120px rgba(255,170,0,0.5),0 0 250px rgba(255,170,0,0.2)', clr:['#fff5c0','#ffaa00','#cc5500','#aa4400'], b:null },
      { w:22, h:22, p:'42%', p2:'65%', sh:'0 0 15px rgba(150,140,120,0.3)', clr:['#b0a89a','#6b6456','#4a4438'], b:null },
      { w:36, h:36, p:'56%', p2:'20%', sh:'0 0 20px rgba(200,170,70,0.3)', clr:['#f5deb3','#c4a450','#8b7335','#6a5928'], b:null },
      { w:42, h:42, p:'24%', p2:'28%', sh:'0 0 30px rgba(50,120,220,0.4)', clr:['#4a9eff','#1a5276','#0d2b45','#1a6b3a'], b:null },
      { w:30, h:30, p:'66%', p2:'62%', sh:'0 0 20px rgba(200,80,40,0.3)', clr:['#e07040','#b5532a','#7a3a1a'], b:null },
      { w:95, h:95, p:'10%', p2:'52%', sh:'0 0 45px rgba(200,150,80,0.3)', clr:['#f5d6a8','#d4a56a','#a07848'], b:[{y:0.28,h:0.06,c:'rgba(180,120,70,0.35)'},{y:0.38,h:0.05,c:'rgba(200,140,80,0.25)'},{y:0.52,h:0.07,c:'rgba(180,100,60,0.3)'}] },
      { w:78, h:78, p:'74%', p2:'30%', sh:'0 0 30px rgba(210,180,140,0.3)', clr:['#f0e0c0','#d4c09a','#b09870'], b:[{y:0.35,h:0.05,c:'rgba(200,180,140,0.25)'},{y:0.48,h:0.04,c:'rgba(180,160,120,0.2)'}] },
      { w:48, h:48, p:'6%', p2:'10%', sh:'0 0 25px rgba(150,200,220,0.3)', clr:['#afdce0','#6baec0','#4a8a9a'], b:null },
      { w:44, h:44, p:'84%', p2:'72%', sh:'0 0 30px rgba(40,80,200,0.3)', clr:['#4a7aff','#1a3a8a','#0a1a5a'], b:null },
    ];
    planetDefs.forEach((d, i) => {
      const div = document.createElement('div');
      div.className = 'planet-img';
      div.style.cssText = `width:${d.w}px;height:${d.h}px;left:${d.p};top:${d.p2};box-shadow:${d.sh}`;
      div.appendChild(createPlanetTexture(d.w, d.h, d.clr, d.b));
      planetsLayer.appendChild(div);
      bodies.push(div);
      if (i === 6) {
        const r1 = document.createElement('div'); r1.className = 'saturn-ring';
        r1.style.cssText = 'width:145px;height:145px;left:calc(74% + 39px - 72.5px);top:calc(30% + 39px - 72.5px);';
        planetsLayer.appendChild(r1); ringEls.push(r1);
        const r2 = document.createElement('div'); r2.className = 'saturn-ring';
        r2.style.cssText = 'width:125px;height:125px;left:calc(74% + 39px - 62.5px);top:calc(30% + 39px - 62.5px);border-width:2px;border-color:rgba(180,160,120,0.2);';
        planetsLayer.appendChild(r2); ringEls.push(r2);
      }
    });

    // --- Stars (400) ---
    const starsLayer = document.getElementById('starsLayer');
    for (let i = 0; i < 400; i++) {
      const s = document.createElement('div'); s.className = 'star';
      s.style.cssText = `width:${Math.random()*2+0.5}px;height:${Math.random()*2+0.5}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${(Math.random()*4+2).toFixed(1)}s;animation-delay:${(Math.random()*6).toFixed(1)}s`;
      starsLayer.appendChild(s);
    }

    // --- Asteroids (70) ---
    const asteroidLayer = document.getElementById('asteroidLayer');
    const astData = [];
    for (let i = 0; i < 70; i++) {
      const a = document.createElement('div'); a.className = 'asteroid';
      const angle = Math.random()*Math.PI*2, dist = 10+Math.random()*48;
      a.style.cssText = `width:${Math.random()*4+1.5}px;height:${Math.random()*4+1.5}px;left:${50+Math.cos(angle)*dist}%;top:${50+Math.sin(angle)*dist*0.5}%;opacity:${0.2+Math.random()*0.4}`;
      asteroidLayer.appendChild(a);
      astData.push({ el:a, angle, dist, speed:0.04+Math.random()*0.08 });
    }

    // --- Particles (40) ---
    const foreLayer = document.getElementById('foreLayer');
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div'); p.className = 'particle';
      p.style.cssText = `width:${Math.random()*3+1.5}px;height:${Math.random()*3+1.5}px;left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${Math.random()*0.4+0.1}`;
      foreLayer.appendChild(p);
    }

    // --- Shooting stars ---
    function launchSS() {
      const ss = document.createElement('div'); ss.className = 'shooting-star';
      const sx = Math.random()*70+10, sy = Math.random()*25+5, ang = 20+Math.random()*35;
      ss.style.cssText = `left:${sx}%;top:${sy}%;width:${70+Math.random()*100}px;transform:rotate(${ang}deg);opacity:0.6`;
      document.body.appendChild(ss);
      ss.animate([
        { transform:`rotate(${ang}deg) translateX(0)`, opacity:0.8 },
        { transform:`rotate(${ang}deg) translateX(300px)`, opacity:0 }
      ], { duration:400+Math.random()*400, easing:'ease-out' }).onfinish = () => ss.remove();
    }
    setInterval(() => { if (Math.random()>0.4) launchSS(); }, 1500);

    // --- Cursor trail (throttled) ---
    let trailTick = 0;
    document.addEventListener('mousemove', (e) => {
      trailTick++;
      if (trailTick % 3 !== 0) return;
      const dot = document.createElement('div'); dot.className = 'trail-dot';
      const s = 3+Math.random()*4;
      dot.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX}px;top:${e.clientY}px;opacity:0.35`;
      document.body.appendChild(dot);
      requestAnimationFrame(() => { dot.style.opacity='0'; dot.style.transform='scale(0.2)'; });
      setTimeout(() => dot.remove(), 500);
    });

    // --- Section text ---
    const secData = [
      { l:'✦ MISSION DEEP SPACE', h:'BEYOND<br>THE <span style="color:#FC3D21">VOID</span>', s:'explore the solar system • 2D parallax', b:'' },
      { l:'✦ MERCURY', h:'<span style="color:#FC3D21">MERCURY</span>', s:'the innermost world', b:'The smallest planet and closest to the Sun. Surface temperatures swing from 430°C to -180°C.' },
      { l:'✦ VENUS', h:'<span style="color:#FC3D21">VENUS</span>', s:'Earth\'s twin', b:'The hottest planet at 465°C. It rotates backwards — the Sun rises in the west.' },
      { l:'✦ EARTH', h:'<span style="color:#FC3D21">EARTH</span>', s:'the pale blue dot', b:'The only known planet with liquid water on its surface and an oxygen-rich atmosphere.' },
      { l:'✦ MARS', h:'<span style="color:#FC3D21">MARS</span>', s:'the red planet', b:'Home to Olympus Mons (21.9 km) — the tallest mountain in the solar system.' },
      { l:'✦ JUPITER', h:'<span style="color:#FC3D21">JUPITER</span>', s:'the gas giant', b:'The largest planet — 1,300 Earths could fit inside. Its Great Red Spot has raged for 400 years.' },
      { l:'✦ SATURN', h:'<span style="color:#FC3D21">SATURN</span>', s:'lord of the rings', b:'Its ring system spans 282,000 km but is only 10 meters thick. It would float in water.' },
      { l:'✦ URANUS', h:'<span style="color:#FC3D21">URANUS</span>', s:'the sideways planet', b:'Rotates on its side with a 98° axial tilt. Coldest atmosphere at -224°C.' },
      { l:'✦ NEPTUNE', h:'<span style="color:#FC3D21">NEPTUNE</span>', s:'the windiest world', b:'Fastest winds in the solar system at 2,100 km/h. Blue color comes from methane.' },
      { l:'✦ MISSION COMPLETE', h:'<span style="color:#FC3D21">END</span> OF TRANSMISSION', s:'8 planets • 70 asteroids • 400 stars • 8 depth layers', b:'' },
    ];
    const uiLayer = document.getElementById('uiLayer');
    const secTexts = [];
    secData.forEach((d, i) => {
      const w = document.createElement('div'); w.className = 'section-text'; w.id = 'st'+i;
      w.innerHTML = `
        ${d.l ? `<div style="font-size:10px;font-weight:600;letter-spacing:0.4em;color:#FC3D21;text-transform:uppercase;text-shadow:0 0 20px rgba(252,61,33,0.3);margin-bottom:12px;">${d.l}</div>` : ''}
        ${d.h ? `<div style="font-size:clamp(2rem,5vw,4.5rem);font-weight:700;letter-spacing:-0.02em;text-align:center;text-shadow:0 0 60px rgba(11,61,145,0.3);">${d.h}</div>` : ''}
        ${d.s ? `<div style="font-size:clamp(0.8rem,1.1vw,0.95rem);font-weight:300;color:rgba(255,255,255,0.4);letter-spacing:0.18em;text-transform:uppercase;margin-top:14px;">${d.s}</div>` : ''}
        ${d.b ? `<div style="max-width:520px;font-size:0.9rem;font-weight:300;color:rgba(255,255,255,0.35);line-height:1.7;text-align:center;margin-top:18px;">${d.b}</div>` : ''}
      `;
      uiLayer.appendChild(w); secTexts.push(w);
    });

    // --- 2D Parallax Engine ---
    const wrap = document.getElementById('sceneWrap');
    const layers = document.querySelectorAll('.layer');
    const progressBar = document.getElementById('scrollProgress');
    const scrollHint = document.getElementById('scrollHint');
    const H = window.innerHeight;

    let mx = 0, my = 0, tx = 0, ty = 0, scrollY = 0;
    let bobTime = 0;

    // Planet orbit data (horizontal drift left on scroll + vertical bob)
    const orbData = [];
    bodies.forEach((b, i) => {
      if (i === 0) { orbData.push(null); return; }
      orbData.push({
        el: b,
        ox: parseFloat(b.style.left),
        oy: parseFloat(b.style.top),
        speed: 0.04 + i * 0.02,
        bobSpd: 0.02 + i * 0.012,
        phase: i * 1.8
      });
    });
    const satRingData = [];
    ringEls.forEach((r) => {
      satRingData.push({ el: r, ox: parseFloat(r.style.left), oy: parseFloat(r.style.top) });
    });

    function updateScroll() {
      scrollY = window.scrollY;
      const maxS = document.documentElement.scrollHeight - window.innerHeight;
      progressBar.style.width = (maxS > 0 ? (scrollY/maxS)*100 : 0) + '%';
      scrollHint.style.opacity = Math.max(0, 1 - scrollY/150);
      // Section text visibility
      for (let i = 0; i < secTexts.length; i++) {
        const el = secTexts[i];
        if (!el) continue;
        const ss = i * H, se = (i + 1.3) * H;
        const sm = (ss + se) / 2, dist = Math.abs(scrollY - sm);
        el.style.opacity = Math.max(0, Math.min(1, dist < H * 0.55 ? 1 - dist / (H * 0.55) : 0));
      }
    }
    window.addEventListener('scroll', updateScroll, { passive: true });

    document.addEventListener('mousemove', (e) => {
      tx = (e.clientX / window.innerWidth) * 2 - 1;
      ty = (e.clientY / window.innerHeight) * 2 - 1;
    });
    document.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      tx = (t.clientX / window.innerWidth) * 2 - 1;
      ty = (t.clientY / window.innerHeight) * 2 - 1;
    }, { passive: true });

    // Glitch
    let gt = 0;
    function glitch() {
      const g = document.createElement('div'); g.className = 'glitch-line';
      g.style.cssText = `top:${Math.random()*100}%;opacity:${Math.random()*0.2+0.05};height:${Math.random()*2+1}px`;
      document.body.appendChild(g);
      setTimeout(() => g.remove(), 100);
    }

    // --- Main loop (optimized) ---
    function loop() {
      mx += (tx - mx) * 0.08;
      my += (ty - my) * 0.08;

      // Layer transforms
      for (const layer of layers) {
        const m = parseFloat(layer.dataset.mouse) || 0;
        const s = parseFloat(layer.dataset.scroll) || 0;
        layer.style.transform = `translate3d(${-mx*m*100}px, ${-my*m*80 + scrollY*s}px, 0)`;
      }

      bobTime += 0.005;

      // Asteroids
      for (const d of astData) {
        d.angle += d.speed * 0.005;
        d.el.style.transform = `translate3d(${Math.cos(d.angle)*d.dist}px, ${Math.sin(d.angle)*d.dist*0.5}px, 0)`;
      }

      // Planets: drift left on scroll + bob
      const maxS = document.documentElement.scrollHeight - window.innerHeight;
      const scrollPct = maxS > 0 ? Math.min(1, scrollY / maxS) : 0;
      const maxDrift = 30;
      for (const d of orbData) {
        if (!d) continue;
        const drift = -scrollPct * maxDrift * d.speed * 8;
        const bobY = Math.sin(bobTime * d.bobSpd * 12 + d.phase) * 1.2;
        const x = d.ox + drift;
        const y = d.oy + bobY;
        d.el.style.left = x + '%';
        d.el.style.top = y + '%';
      }

      // Saturn rings follow
      if (orbData[6]) {
        const s = orbData[6];
        const sL = s.el.style.left, sT = s.el.style.top;
        if (sL && sT) {
          const sLv = parseFloat(sL), sTv = parseFloat(sT);
          for (const rd of satRingData) {
            rd.el.style.left = (rd.ox + (sLv - s.ox)) + '%';
            rd.el.style.top = (rd.oy + (sTv - s.oy)) + '%';
          }
        }
      }

      // Glitch
      if (++gt > 150 + Math.random() * 200) { glitch(); gt = 0; }

      requestAnimationFrame(loop);
    }

    loop();
    updateScroll();

    // --- Gravity (throttled) ---
    let gravTick = 0;
    document.addEventListener('mousemove', (e) => {
      gravTick++;
      if (gravTick % 2 !== 0) return;
      for (const p of bodies) {
        const r = p.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 350) {
          const f = (1 - dist/350) * 7, a = Math.atan2(dy, dx);
          p.style.transform = `translate(${Math.cos(a)*f}px, ${Math.sin(a)*f}px) scale(${1+f*0.006})`;
          p.style.transition = 'transform 0.15s';
        } else {
          p.style.transform = '';
          p.style.transition = 'transform 0.4s';
        }
      }
    });

    console.log('%cNASA 2D Parallax %cOptimized', 'color:#FC3D21', 'color:#0B3D91');
  </script>
</body>
</html>
