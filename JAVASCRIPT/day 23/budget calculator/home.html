<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Budget Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/855/855390.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-900" style="background-image: url('bg.png'); background-size: cover; background-attachment: fixed; background-position: center;">
    <section class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-lg border-2 border-slate-800 shadow-lg p-6 w-full max-w-md text-center">
            <h1 class="text-2xl font-bold uppercase mb-1">Budget Calculator</h1>
            <p class="text-slate-700 text-sm mb-6">Track your monthly income and expenses.</p>

            <div id="guestButtons" class="space-y-3">
                <a href="signin.html"
                    class="block w-full px-4 py-2 bg-emerald-600 text-white text-sm font-semibold rounded-md hover:bg-emerald-700 active:bg-emerald-800">Login</a>
                <a href="signup.html"
                    class="block w-full px-4 py-2 bg-slate-800 text-white text-sm font-semibold rounded-md hover:bg-slate-900 active:bg-black">Sign up</a>
            </div>

            <div id="userButtons" class="hidden space-y-3">
                <p id="userGreeting" class="text-sm font-semibold text-slate-700"></p>
                <a href="index.html"
                    class="block w-full px-4 py-2 bg-emerald-600 text-white text-sm font-semibold rounded-md hover:bg-emerald-700 active:bg-emerald-800">Open Calculator</a>
                <button id="logoutBtn" type="button"
                    class="w-full px-4 py-2 bg-red-600 text-white text-sm font-semibold rounded-md hover:bg-red-700 active:bg-red-800">Logout</button>
            </div>
        </div>
    </section>

    <script src="auth.js"></script>
    <script src="home.js"></script>
</body>
</html>
