<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Budget Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/855/855390.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-900" style="background-image: url('bg.png'); background-size: cover; background-attachment: fixed; background-position: center;">
    <section class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-lg border-2 border-slate-800 shadow-lg p-6 w-full max-w-md">
            <h1 class="text-2xl font-bold uppercase text-center mb-1">Budget Calculator</h1>
            <p class="text-slate-700 text-sm text-center mb-6">Create your account</p>

            <form id="signupForm" class="space-y-3">
                <input id="signupName" type="text" placeholder="Name"
                    class="w-full px-3 py-2 border-2 border-slate-600 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400" required>
                <input id="signupEmail" type="email" placeholder="Email"
                    class="w-full px-3 py-2 border-2 border-slate-600 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400" required>
                <input id="signupPass" type="password" placeholder="Password"
                    class="w-full px-3 py-2 border-2 border-slate-600 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400" required>
                <button type="submit"
                    class="w-full px-4 py-2 bg-emerald-600 text-white text-sm font-semibold rounded-md hover:bg-emerald-700 active:bg-emerald-800">Sign up</button>
                <p class="text-sm text-center text-slate-700">
                    Already have an account?
                    <a href="signin.html" class="text-emerald-600 font-semibold hover:underline">Login</a>
                </p>
                <p class="text-sm text-center">
                    <a href="home.html" class="text-slate-700 hover:underline">Back to home</a>
                </p>
            </form>

            <p id="authMessage" class="text-sm text-red-600 text-center mt-4 hidden"></p>
        </div>
    </section>

    <script src="auth.js"></script>
    <script src="signup.js"></script>
</body>
</html>
