<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO</title>
  <meta name="description" content="A CRUD task manager built on the JSONPlaceholder todos API with a localStorage cache.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <main class="page">

      <header class="masthead">
        <div>
        
          <h1 class="masthead-title">TODO<em> LIST</em>.</h1>
       
        </div>
      </header>

      <section class="stats" aria-label="Task counts">
        <div class="stat">
          <span class="stat-label">Total</span>
          <span class="stat-value" id="statTotal">0</span>
        </div>
        <div class="stat ok">
          <span class="stat-label">Done</span>
          <span class="stat-value" id="statDone">0</span>
        </div>
        <div class="stat warn">
          <span class="stat-label">Open</span>
          <span class="stat-value" id="statLeft">0</span>
        </div>
      </section>

      <section class="toolbar">
        <div class="search-wrap">
          <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
          <input type="search" id="searchInput" class="search" placeholder="Search by title…" autocomplete="off">
        </div>

        <div class="filters" role="group" aria-label="Filter by status">
          <button class="filter-btn is-active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="done" type="button">Done</button>
          <button class="filter-btn" data-filter="todo" type="button">Open</button>
        </div>

        <button id="addTodoBtn" class="btn btn-primary btn-add" type="button">+ New task</button>
      </section>

      <section class="board">
        <div id="errorBox" class="error-box hidden" role="alert">
          <div class="error-txt">
            <strong>Sync failed.</strong>
            <span id="errorMsg"></span>
          </div>
          <button id="retryBtn" class="btn-act edit" type="button">Retry</button>
        </div>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>

        <div id="skeleton" class="skeleton hidden" aria-hidden="true">
          <div class="sk-row"></div>
          <div class="sk-row"></div>
          <div class="sk-row"></div>
          <div class="sk-row"></div>
          <div class="sk-row"></div>
          <div class="sk-row"></div>
        </div>

        <div id="empty" class="empty hidden">
          <span class="empty-mark">∅</span>
          <p id="emptyMsg">Nothing here yet.</p>
        </div>
      </section>

      <footer class="foot">
        <p>TODO LIST</p>

      </footer>
    </main>
  </div>

  <div class="modal fade" id="todoModal" tabindex="-1" aria-labelledby="todoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="todoModalLabel">New task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="todoForm" novalidate>
          <div class="modal-body">
            <label class="field-label" for="todoTitle">Title</label>
            <input type="text" id="todoTitle" class="form-control field" placeholder="e.g. Write the weekly report"
                   maxlength="200" required>
            <div class="form-check form-switch done-switch">
              <input class="form-check-input" type="checkbox" id="todoDone" role="switch">
              <label class="form-check-label" for="todoDone">Mark as completed</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <span class="btn-txt">Add task</span><span class="spinner hidden"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete task?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>This permanently removes</p>
          <p class="delete-quote" id="deleteTitle"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Keep it</button>
          <button type="button" class="btn btn-danger" id="confirmDelete">
            <span class="btn-txt">Delete</span><span class="spinner hidden"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-c" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
