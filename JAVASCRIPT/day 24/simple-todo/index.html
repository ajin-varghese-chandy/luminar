<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO List</title>
  <meta name="description" content="A simple CRUD task manager built on the JSONPlaceholder todos API with a localStorage cache.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
      <h1 class="h3 mb-0">TODO List</h1>
      <span class="text-muted small" id="today"></span>
    </header>

    <div class="row g-3 mb-4 text-center">
      <div class="col-4">
        <div class="card">
          <div class="card-body py-3">
            <div class="text-muted small text-uppercase">Total</div>
            <div class="fs-3 fw-bold" id="statTotal">0</div>
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="card">
          <div class="card-body py-3">
            <div class="text-muted small text-uppercase">Done</div>
            <div class="fs-3 fw-bold text-success" id="statDone">0</div>
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="card">
          <div class="card-body py-3">
            <div class="text-muted small text-uppercase">Open</div>
            <div class="fs-3 fw-bold text-warning" id="statLeft">0</div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <div class="input-group" style="max-width: 320px;">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="search" id="searchInput" class="form-control" placeholder="Search by title…" autocomplete="off">
      </div>

      <div class="btn-group" role="group" aria-label="Filter by status">
        <button class="btn btn-outline-secondary filter-btn is-active" data-filter="all" type="button">All</button>
        <button class="btn btn-outline-secondary filter-btn" data-filter="done" type="button">Done</button>
        <button class="btn btn-outline-secondary filter-btn" data-filter="todo" type="button">Open</button>
      </div>

      <button id="addTodoBtn" class="btn btn-primary ms-auto" type="button">+ New task</button>
    </div>

    <div id="errorBox" class="alert alert-danger d-flex justify-content-between align-items-center d-none" role="alert">
      <div>
        <strong>Sync failed.</strong>
        <span id="errorMsg"></span>
      </div>
      <button id="retryBtn" class="btn btn-sm btn-outline-danger" type="button">Retry</button>
    </div>

    <ul id="todoList" class="list-group" aria-live="polite"></ul>

    <div id="skeleton" class="d-none">
      <div class="placeholder-glow">
        <div class="placeholder col-12 mb-2" style="height: 52px;"></div>
        <div class="placeholder col-12 mb-2" style="height: 52px;"></div>
        <div class="placeholder col-12 mb-2" style="height: 52px;"></div>
        <div class="placeholder col-12 mb-2" style="height: 52px;"></div>
      </div>
    </div>

    <div id="empty" class="text-center text-muted py-5 d-none">
      <p class="mb-1 fs-5">∅</p>
      <p id="emptyMsg" class="mb-0 small">Nothing here yet.</p>
    </div>

    <footer class="mt-4 pt-3 border-top text-muted small">TODO LIST</footer>
  </div>

  <div class="modal fade" id="todoModal" tabindex="-1" aria-labelledby="todoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="todoModalLabel">New task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="todoForm" novalidate>
          <div class="modal-body">
            <label class="form-label" for="todoTitle">Title</label>
            <input type="text" id="todoTitle" class="form-control" placeholder="e.g. Write the weekly report"
                   maxlength="200" required>
            <div class="form-check form-switch mt-3">
              <input class="form-check-input" type="checkbox" id="todoDone" role="switch">
              <label class="form-check-label" for="todoDone">Mark as completed</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <span class="btn-txt">Add task</span><span class="spinner-border spinner-border-sm d-none"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete task?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted">This permanently removes</p>
          <p class="fst-italic" id="deleteTitle"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Keep it</button>
          <button type="button" class="btn btn-danger" id="confirmDelete">
            <span class="btn-txt">Delete</span><span class="spinner-border spinner-border-sm d-none"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-c"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
