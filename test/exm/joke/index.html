<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jOKE Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background-image: url('bg.mp4');
    }
    img {
  animation: spin 3s linear infinite;
  
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

</style>
</head>
<body>
    <center>
     <h1 class="display-5 fw-bold text-danger  mt-5">
          <i>  Random Joke Generator</i>
            <img src="https://www.animatedimages.org/data/media/1309/animated-laughing-image-0010.gif" alt="" srcset="">
        </h1>
        </center>
 <video style="width: 100%;height: 100vh;" autoplay muted loop playsinline id="bg-video">
    <source src="bg.mp4" type="video/mp4">
 </video>
    <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg border-0 rounded-4 p-5 text-center" style="max-width: 600px; width: 100%;">
        

        

        <div class="">
            <h1 class="display-5 fw-bold text-danger  mt-5">
         
            <img src="https://www.animatedimages.org/data/media/1309/animated-laughing-image-0010.gif" alt="" srcset="">
        </h1>
            <h2 id="setup" class="fs-1 text-dark mb-3"></h2>
            <h3 id="punchline" class="fs-2 text-danger"></h3>
        </div>
        <br><br>
     <img style="display: block;margin: auto; margin-bottom: 10px;" src="https://i.pinimg.com/736x/4c/06/63/4c0663bd221059001635238ec5bb603f.jpg"  height="300" width="400" >
        <button 
            onclick="getJoke()" 
            class="btn btn-primary btn-lg rounded-pill px-5"
        >
            Get Joke
        </button>

    </div>
</div>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
