
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">Student Management System</h1>

        
        <div class="container my-5">
             <div id="alertBox"></div>
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
<p id="alert" class="d-none text-danger mb-3"></p>
            <div class="card border-2 rounded-4">
                <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
                     
                    <h4 class="mb-0">New Student</h4>
                </div>

                <div class="card-body p-4">
                   

                    <div class="row g-4">

                        <div class="col-md-6">
                            <label for="studentName" class="form-label fw-semibold">
                                Student Name
                            </label>
                            <input
                                type="text"
                                class="form-control form-control-lg"
                                id="studentName"
                                placeholder="Enter student name"
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="course" class="form-label fw-semibold">
                                Course
                            </label>
                            <select class="form-select form-select-lg" id="course">
                                <option selected disabled>Choose a Course</option>
                                <option value="MERN">MERN</option>
                                <option value="Python">Python</option>
                                <option value="Java">Java</option>
                                <option value="Dot Net">Dot Net</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <button
                                type="button"
                                onclick="addStudent()"
                                class="btn btn-primary btn-lg w-100"
                            >
                                Add Student
                            </button>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

      
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>test name</td>
                            <td>course mern</td>
                            <td>
                                <button class="btn btn-sm btn-warning">Edit</button>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-danger">Delete</button>
                            </td>
                        </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>

<div class="modal fade" id="editModal">
    <div class="modal-dialog">
        <div class="modal-content">
 <div class="modal-header">
 <h5 class="modal-title">Edit Student</h5>

      <button   type="button"   class="btn-close"  data-bs-dismiss="modal"> </button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="editStudentId">

                <div class="mb-3">
                    <label class="form-label">Name</label>

                    <input
                        type="text"
                        id="editStudentName"
                        class="form-control"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Course</label>

                    <select id="editCourse" class="form-select">
                        <option value="">Choose a Course</option>
                        <option value="MERN">MERN</option>
                        <option value="Python">Python</option>
                        <option value="Java">Java</option>
                        <option value="Dot Net">Dot Net</option>
                    </select>
                </div>

                <p id="editAlert" class="text-danger"></p>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="updateStudent()"
                >
                    Update
                </button>

            </div>

        </div>
    </div>
   

</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
